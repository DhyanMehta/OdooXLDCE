[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campusos-api"
version = "0.2.0"
description = "CampusOS API — student organization management platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0,<1.0",
    "pydantic-settings>=2.6.0,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30.0,<1.0",
    "greenlet>=3.0.0,<4.0",
    "alembic>=1.14.0,<2.0",
    "pwdlib[argon2]>=0.2.0,<1.0",
    "email-validator>=2.0.0,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "itsdangerous>=2.2.0,<3.0",
    "cryptography>=43.0.0,<47.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "httpx>=0.28.0,<1.0",
]

[project.scripts]
campusos-worker = "app.worker:main"
campusos-seed = "app.seed:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

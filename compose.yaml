# CampusOS — PostgreSQL only (Phase 1)
# Credentials and database name come from database/.env

services:
  postgres:
    image: postgres:16
    container_name: campusos-postgres
    restart: unless-stopped
    env_file:
      - ./database/.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - campusos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  campusos_pgdata:
    name: campusos_pgdata
